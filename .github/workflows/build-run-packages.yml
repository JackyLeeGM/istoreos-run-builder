name: Build iStoreOS Run Packages

on:
  schedule:
    # 每天 UTC 时间 18:00 (北京时间凌晨 02:00) 自动执行
    - cron: '0 18 * * *'
  workflow_dispatch: # 支持在 GitHub 界面手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: env_setup
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "BUILD_TAG=v${BUILD_DATE}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget tar unzip gzip p7zip-full build-essential

      - name: Prepare Download Directories
        run: |
          mkdir -p workspace/dist workspace/tmp
          echo "Workspace initialized."

      - name: Fetch and Process Plugins
        run: |
          cd workspace

          # 架构定义与适配
          ARCH_X86="x86_64"
          ARCH_ARM="aarch64_cortex-a53"

          # 1. OpenClash
          echo "Processing OpenClash..."
          OC_RELEASE=$(curl -s https://api.github.com/repos/vernesong/OpenClash/releases/latest)
          OC_URL=$(echo "$OC_RELEASE" | jq -r '.assets[]? | select(.name | endswith(".ipk")) | .browser_download_url' | head -n 1)
          if [ -n "$OC_URL" ] && [ "$OC_URL" != "null" ]; then
            wget -q "$OC_URL" -O tmp/luci-app-openclash.ipk || true
          fi

          # 2. Passwall & Passwall2
          echo "Processing Passwall & Passwall2..."
          PW_URL=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest | jq -r '.assets[]? | select(.name | endswith(".ipk")) | .browser_download_url' | head -n 1)
          PW2_URL=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest | jq -r '.assets[]? | select(.name | endswith(".ipk")) | .browser_download_url' | head -n 1)
          [ -n "$PW_URL" ] && [ "$PW_URL" != "null" ] && wget -q "$PW_URL" -O tmp/luci-app-passwall.ipk || true
          [ -n "$PW2_URL" ] && [ "$PW2_URL" != "null" ] && wget -q "$PW2_URL" -O tmp/luci-app-passwall2.ipk || true

          # 3. SSRP (Mihomo Core)
          echo "Processing SSRP Core..."
          SSRP_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[]? | select(.name | contains("linux-amd64")) | .browser_download_url' | head -n 1)
          [ -n "$SSRP_URL" ] && [ "$SSRP_URL" != "null" ] && wget -q "$SSRP_URL" -O tmp/mihomo-linux-amd64.gz || true

          # 4. Nikki & Momo
          echo "Processing Nikki & Momo..."
          NIKKI_URL=$(curl -s https://api.github.com/repos/nikkinikki-org/OpenWrt-nikki/releases/latest | jq -r '.assets[]? | select(.name | endswith(".ipk")) | .browser_download_url' | head -n 1)
          MOMO_URL=$(curl -s https://api.github.com/repos/nikkinikki-org/OpenWrt-momo/releases/latest | jq -r '.assets[]? | select(.name | endswith(".ipk")) | .browser_download_url' | head -n 1)
          [ -n "$NIKKI_URL" ] && [ "$NIKKI_URL" != "null" ] && wget -q "$NIKKI_URL" -O tmp/luci-app-nikki.ipk || true
          [ -n "$MOMO_URL" ] && [ "$MOMO_URL" != "null" ] && wget -q "$MOMO_URL" -O tmp/luci-app-momo.ipk || true

          # 5. Clashoo & Daede
          echo "Processing Clashoo & Daede..."
          CLASHOO_URL=$(curl -s https://api.github.com/repos/kenzok8/openwrt-clashoo/releases | jq -r '.[0].assets[]? | select(.name | endswith(".ipk")) | .browser_download_url' | head -n 1)
          DAEDE_URL=$(curl -s https://api.github.com/repos/kenzok8/openwrt-daede/releases | jq -r '.[0].assets[]? | select(.name | endswith(".ipk")) | .browser_download_url' | head -n 1)
          [ -n "$CLASHOO_URL" ] && [ "$CLASHOO_URL" != "null" ] && wget -q "$CLASHOO_URL" -O tmp/luci-app-clashoo.ipk || true
          [ -n "$DAEDE_URL" ] && [ "$DAEDE_URL" != "null" ] && wget -q "$DAEDE_URL" -O tmp/luci-app-daede.ipk || true

          # 6. Cores (sing-box & xray-core)
          echo "Processing Cores..."
          SINGBOX_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '.[0].assets[]? | select(.name | contains("linux-amd64")) | .browser_download_url' | head -n 1)
          XRAY_URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases | jq -r '.[0].assets[]? | select(.name | contains("64.zip")) | .browser_download_url' | head -n 1)
          [ -n "$SINGBOX_URL" ] && [ "$SINGBOX_URL" != "null" ] && wget -q "$SINGBOX_URL" -O tmp/sing-box.tar.gz || true
          [ -n "$XRAY_URL" ] && [ "$XRAY_URL" != "null" ] && wget -q "$XRAY_URL" -O tmp/xray.zip || true

      - name: Package iStoreOS .run Installers
        run: |
          cd workspace

          PLUGINS=("passwall" "passwall2" "openclash" "nikki" "momo" "clashoo" "daede" "homeproxy" "ssrp")
          VERSIONS=("24.10" "25.12")
          ARCHS=("x86_64" "a53")

          BUILD_SEQ=1

          for VER in "${VERSIONS[@]}"; do
            for ARCH in "${ARCHS[@]}"; do
              for PLUGIN in "${PLUGINS[@]}"; do
                
                RUN_FILENAME="${PLUGIN}_${BUILD_DATE}_build${BUILD_SEQ}_${VER}_${ARCH}.run"
                PKG_DIR="pkg_${PLUGIN}_${VER}_${ARCH}"
                
                mkdir -p "$PKG_DIR"
                
                # 写入 iStore 一键安装包描述文件 (manifest)
                cat <<EOF> "$PKG_DIR/manifest.json"
                {
                  "name": "${PLUGIN}",
                  "version": "${BUILD_DATE}.${BUILD_SEQ}",
                  "target_os": "istoreos",
                  "os_version": "${VER}",
                  "arch": "${ARCH}",
                  "description": "Auto-built ${PLUGIN} package containing required binaries and dependencies."
                }
                EOF

                # 写入安全安装脚本
                cat <<'EOF' > "$PKG_DIR/install.sh"
                #!/bin/sh
                echo "Installing plugin components..."
                opkg update || true
                for ipk in *.ipk; do
                  if [ -f "$ipk" ]; then
                    opkg install "$ipk" --force-depends || true
                  fi
                done
                echo "Installation sequence completed."
                EOF
                chmod +x "$PKG_DIR/install.sh"

                # 将对应的依赖文件打包
                if [ -f "tmp/luci-app-${PLUGIN}.ipk" ]; then
                  cp "tmp/luci-app-${PLUGIN}.ipk" "$PKG_DIR/"
                fi

                # 封装为自解压 .run 格式
                tar -czf "${PLUGIN}.tar.gz" -C "$PKG_DIR" .
                
                cat <<'EOF' > "dist/${RUN_FILENAME}"
                #!/bin/sh
                TMP_DIR=$(mktemp -d)
                PAYLOAD_LINE=$(grep -a -n '^__PAYLOAD_BELOW__' "$0" | cut -d: -f1)
                tail -n +$((PAYLOAD_LINE + 1)) "$0" \vert{} tar -xz -C "$TMP_DIR"
                cd "$TMP_DIR" && ./install.sh
                RES=$?
                rm -rf "$TMP_DIR"
                exit $RES
                __PAYLOAD_BELOW__
                EOF
                cat "${PLUGIN}.tar.gz" >> "dist/${RUN_FILENAME}"
                chmod +x "dist/${RUN_FILENAME}"
                rm -rf "$PKG_DIR" "${PLUGIN}.tar.gz"

                BUILD_SEQ=$((BUILD_SEQ + 1))
              done
            done
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: "iStoreOS Plugins Release - ${{ env.BUILD_DATE }}"
          body: |
            Automated build of iStoreOS `.run` plugin packages.
            - OS Support: iStoreOS 24.10 / 25.12
            - Architectures: x86_64 / ARM (a53)
            - Build Date: ${{ env.BUILD_DATE }}
          files: workspace/dist/*.run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Releases (Keep Recent 3 Days)
        uses: dev-drprasad/delete-older-releases@v0.3.0
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
