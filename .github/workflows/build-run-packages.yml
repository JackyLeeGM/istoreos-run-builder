name: Build iStoreOS Run Packages

on:
  schedule:
    # 每天 UTC 时间 18:00 (北京时间凌晨 02:00) 自动执行
    - cron: '0 18 * * *'
  workflow_dispatch: # 支持在 GitHub 界面手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: env_setup
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "BUILD_TAG=v${BUILD_DATE}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget tar unzip gzip p7zip-full build-essential

      - name: Prepare Download Directories
        run: |
          mkdir -p workspace/dist workspace/downloads_ipk workspace/downloads_apk
          echo "Workspace initialized."

      - name: Download All Cores
        run: |
          cd workspace

          echo "=== Downloading Universal Core Binaries ==="
          # Mihomo (Clash Meta Core)
          MIHOMO_X86_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[]? | select(.name | contains("linux-amd64-compatible") and (endswith(".gz") or endswith(".tar.gz"))) | .browser_download_url' | head -n 1)
          MIHOMO_ARM_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[]? | select(.name | contains("linux-arm64") and (endswith(".gz") or endswith(".tar.gz"))) | .browser_download_url' | head -n 1)
          [ -n "$MIHOMO_X86_URL" ] && wget -q "$MIHOMO_X86_URL" -O mihomo_x86.gz && gunzip -f mihomo_x86.gz && chmod +x mihomo_x86 && mv mihomo_x86 downloads_ipk/ && cp downloads_ipk/mihomo_x86 downloads_apk/ || true
          [ -n "$MIHOMO_ARM_URL" ] && wget -q "$MIHOMO_ARM_URL" -O mihomo_arm.gz && gunzip -f mihomo_arm.gz && chmod +x mihomo_arm && mv mihomo_arm downloads_ipk/ && cp downloads_ipk/mihomo_arm downloads_apk/ || true

          # Sing-Box Core
          SINGBOX_X86_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.assets[]? | select(.name | contains("linux-amd64.tar.gz")) | .browser_download_url' | head -n 1)
          SINGBOX_ARM_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.assets[]? | select(.name | contains("linux-arm64.tar.gz")) | .browser_download_url' | head -n 1)
          [ -n "$SINGBOX_X86_URL" ] && wget -q "$SINGBOX_X86_URL" -O singbox_x86.tar.gz && tar -xzf singbox_x86.tar.gz && mv sing-box-*/sing-box downloads_ipk/singbox_x86 && cp downloads_ipk/singbox_x86 downloads_apk/ || true
          [ -n "$SINGBOX_ARM_URL" ] && wget -q "$SINGBOX_ARM_URL" -O singbox_arm.tar.gz && tar -xzf singbox_arm.tar.gz && mv sing-box-*/sing-box downloads_ipk/singbox_arm && cp downloads_ipk/singbox_arm downloads_apk/ || true

          # Xray Core
          XRAY_X86_URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.assets[]? | select(.name | contains("64.zip") and (contains("arm") | not)) | .browser_download_url' | head -n 1)
          XRAY_ARM_URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.assets[]? | select(.name | contains("arm64-v8a.zip")) | .browser_download_url' | head -n 1)
          [ -n "$XRAY_X86_URL" ] && wget -q "$XRAY_X86_URL" -O xray_x86.zip && unzip -q xray_x86.zip -d xray_x86_dir && mv xray_x86_dir/xray downloads_ipk/xray_x86 && cp downloads_ipk/xray_x86 downloads_apk/ || true
          [ -n "$XRAY_ARM_URL" ] && wget -q "$XRAY_ARM_URL" -O xray_arm.zip && unzip -q xray_arm.zip -d xray_arm_dir && mv xray_arm_dir/xray downloads_ipk/xray_arm && cp downloads_ipk/xray_arm downloads_apk/ || true

      - name: Download Full IPK & APK Assets for ALL Plugins
        run: |
          cd workspace

          echo "=== Fetching Full Release Assets & Dependencies (.ipk & .apk) ==="

          # 定义获取 Github 最新 Release 全量 Assets 的通用函数
          download_github_assets() {
            REPO=$1
            RELEASE_DATA=$(curl -s "https://api.github.com/repos/${REPO}/releases/latest")
            echo "$RELEASE_DATA" | jq -r '.assets[]? | select(.name | endswith(".ipk")) | .browser_download_url' | xargs -n1 wget -q -P downloads_ipk/ || true
            echo "$RELEASE_DATA" | jq -r '.assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | xargs -n1 wget -q -P downloads_apk/ || true
          }

          # 1. 下载全量主插件及其所有关联依赖包（Passwall, Passwall2, OpenClash, Nikki, Momo, HomeProxy, Singbox等）
          download_github_assets "Openwrt-Passwall/openwrt-passwall"
          download_github_assets "Openwrt-Passwall/openwrt-passwall2"
          download_github_assets "vernesong/OpenClash"
          download_github_assets "nikkinikki-org/OpenWrt-nikki"
          download_github_assets "nikkinikki-org/OpenWrt-momo"
          download_github_assets "immortalwrt/homeproxy"
          download_github_assets "kyuchao/luci-app-sing-box"

          # 2. 抓取 Kenzok8 整合依赖仓库的全量包，提供强大的离线兜底依赖池
          KENZOK8_IPKS=$(curl -s https://api.github.com/repos/kenzok8/openwrt-packages/releases | jq -r '.[0].assets[]? | select(.name | endswith(".ipk")) | .browser_download_url')
          for url in $KENZOK8_IPKS; do
            wget -q "$url" -P downloads_ipk/ || true
          done

          KENZOK8_APKS=$(curl -s https://api.github.com/repos/kenzok8/openwrt-packages/releases | jq -r '.[0].assets[]? | select(.name | endswith(".apk")) | .browser_download_url')
          for url in $KENZOK8_APKS; do
            wget -q "$url" -P downloads_apk/ || true
          done

      - name: Package Bundled Universal .run Installers
        run: |
          cd workspace

          PLUGINS=("openclash" "passwall" "passwall2" "nikki" "momo" "clashoo" "daede" "ssrp" "homeproxy" "singbox")
          VERSIONS=("istoreos24.10" "istoreos25.12")
          ARCHS=("x86_64" "aarch64_generic")

          for OS_VER in "${VERSIONS[@]}"; do
            for ARCH in "${ARCHS[@]}"; do

              for PLUGIN in "${PLUGINS[@]}"; do
                RUN_FILENAME="${PLUGIN}_${OS_VER}_${ARCH}_${BUILD_DATE}.run"
                PKG_DIR="pkg_${PLUGIN}_${OS_VER}_${ARCH}"
                
                mkdir -p "$PKG_DIR/cores" "$PKG_DIR/packages"
                
                # 确定使用的源目录 (25.12 使用 APK，24.10 使用 IPK)
                SRC_DIR="downloads_ipk"
                [ "$OS_VER" = "istoreos25.12" ] && SRC_DIR="downloads_apk"

                # 1. 深度离线打包逻辑：将同环境下所有依赖组件（如 tcping, geoview, chinadns-ng 等）一并全量复制入包
                cp "$SRC_DIR"/* "$PKG_DIR/packages/" 2>/dev/null || true

                # 2. 注入对应架构的通用二进制 Core
                if [ "$ARCH" = "x86_64" ]; then
                  [ -f "$SRC_DIR/mihomo_x86" ] && cp "$SRC_DIR/mihomo_x86" "$PKG_DIR/cores/mihomo"
                  [ -f "$SRC_DIR/singbox_x86" ] && cp "$SRC_DIR/singbox_x86" "$PKG_DIR/cores/sing-box"
                  [ -f "$SRC_DIR/xray_x86" ] && cp "$SRC_DIR/xray_x86" "$PKG_DIR/cores/xray"
                else
                  [ -f "$SRC_DIR/mihomo_arm" ] && cp "$SRC_DIR/mihomo_arm" "$PKG_DIR/cores/mihomo"
                  [ -f "$SRC_DIR/singbox_arm" ] && cp "$SRC_DIR/singbox_arm" "$PKG_DIR/cores/sing-box"
                  [ -f "$SRC_DIR/xray_arm" ] && cp "$SRC_DIR/xray_arm" "$PKG_DIR/cores/xray"
                fi

                # 3. 生成 manifest.json
                jq -n \
                  --arg name "$PLUGIN" \
                  --arg version "${BUILD_DATE}" \
                  --arg target_os "istoreos" \
                  --arg os_version "$OS_VER" \
                  --arg arch "$ARCH" \
                  --arg description "Universal full-offline package for NanoPi ARM64 series (R2S/R3S/R4S/R5S/R5C/R6S/R76S) and x86_64." \
                  '{name: $name, version:$version, target_os: $target_os, os_version:$os_version, arch: $arch, description:$description}' \
                  > "$PKG_DIR/manifest.json"

                # 4. 生成通用增强型强鲁棒 install.sh 脚本
                INSTALL_SH="$PKG_DIR/install.sh"
                echo '#!/bin/sh' > "$INSTALL_SH"
                echo 'echo "========================================="' >> "$INSTALL_SH"
                echo 'echo "Starting universal installation for '${PLUGIN}'..."' >> "$INSTALL_SH"
                echo 'echo "========================================="' >> "$INSTALL_SH"
                
                # 部署 Core 二进制
                echo 'if [ -d "./cores" ]; then' >> "$INSTALL_SH"
                echo '  echo "-> Deploying core binaries..."' >> "$INSTALL_SH"
                echo '  mkdir -p /etc/openclash/core /usr/bin' >> "$INSTALL_SH"
                echo '  [ -f "./cores/mihomo" ] && cp -f ./cores/mihomo /etc/openclash/core/clash_meta && cp -f ./cores/mihomo /usr/bin/mihomo && chmod +x /etc/openclash/core/clash_meta /usr/bin/mihomo 2>/dev/null || true' >> "$INSTALL_SH"
                echo '  [ -f "./cores/sing-box" ] && cp -f ./cores/sing-box /usr/bin/sing-box && chmod +x /usr/bin/sing-box 2>/dev/null || true' >> "$INSTALL_SH"
                echo '  [ -f "./cores/xray" ] && cp -f ./cores/xray /usr/bin/xray && chmod +x /usr/bin/xray 2>/dev/null || true' >> "$INSTALL_SH"
                echo 'fi' >> "$INSTALL_SH"

                # 自动判定包管理器 (APK 体系 vs OPKG 体系)
                echo 'if command -v apk >/dev/null 2>&1; then' >> "$INSTALL_SH"
                echo '  echo "-> Detected APK package manager (iStoreOS 25.12+)"' >> "$INSTALL_SH"
                echo '  apk update || true' >> "$INSTALL_SH"
                echo '  echo "-> Installing system base tools..."' >> "$INSTALL_SH"
                echo '  apk add --allow-untrusted ca-certificates curl wget unzip 2>/dev/null || true' >> "$INSTALL_SH"
                
                echo '  if [ -d "./packages" ]; then' >> "$INSTALL_SH"
                echo '    echo "-> Phase 1: Pre-installing binary dependencies..."' >> "$INSTALL_SH"
                echo '    for pkg in ./packages/*.apk; do' >> "$INSTALL_SH"
                echo '      case "$pkg" in' >> "$INSTALL_SH"
                echo '        *luci-app-*|*luci-i18n-*) ;;' >> "$INSTALL_SH"
                echo '        *) [ -f "$pkg" ] && apk add --allow-untrusted "$pkg" 2>/dev/null \vert{}\vert{} true ;;' >> "$INSTALL_SH"
                echo '      esac' >> "$INSTALL_SH"
                echo '    done' >> "$INSTALL_SH"

                echo '    echo "-> Phase 2: Installing target LuCI app & language packs..."' >> "$INSTALL_SH"
                echo '    for pkg in ./packages/*'$PLUGIN'*.apk ./packages/luci-app-'$PLUGIN'*.apk ./packages/luci-i18n-'$PLUGIN'*.apk; do' >> "$INSTALL_SH"
                echo '      if [ -f "$pkg" ]; then' >> "$INSTALL_SH"
                echo '        echo "Installing $pkg..."' >> "$INSTALL_SH"
                echo '        apk add --allow-untrusted --force-non-repository --force-broken-world "$pkg" \vert{}\vert{} true' >> "$INSTALL_SH"
                echo '      fi' >> "$INSTALL_SH"
                echo '    done' >> "$INSTALL_SH"
                echo '  fi' >> "$INSTALL_SH"

                echo 'elif command -v opkg >/dev/null 2>&1; then' >> "$INSTALL_SH"
                echo '  echo "-> Detected OPKG package manager (iStoreOS 24.10)"' >> "$INSTALL_SH"
                echo '  opkg update || true' >> "$INSTALL_SH"
                echo '  echo "-> Installing system dependencies..."' >> "$INSTALL_SH"
                echo '  opkg install ca-certificates ca-bundle curl wget-ssl unzip --force-depends || true' >> "$INSTALL_SH"
                echo '  echo "-> Installing IPK packages..."' >> "$INSTALL_SH"
                echo '  if [ -d "./packages" ]; then' >> "$INSTALL_SH"
                echo '    for pkg in ./packages/*.ipk; do' >> "$INSTALL_SH"
                echo '      if [ -f "$pkg" ]; then' >> "$INSTALL_SH"
                echo '        echo "Installing $pkg..."' >> "$INSTALL_SH"
                echo '        opkg install "$pkg" --force-depends --force-overwrite \vert{}\vert{} true' >> "$INSTALL_SH"
                echo '      fi' >> "$INSTALL_SH"
                echo '    done' >> "$INSTALL_SH"
                echo '  fi' >> "$INSTALL_SH"
                echo 'else' >> "$INSTALL_SH"
                echo '  echo "Error: Neither apk nor opkg package manager found!"' >> "$INSTALL_SH"
                echo '  exit 1' >> "$INSTALL_SH"
                echo 'fi' >> "$INSTALL_SH"

                # 刷新 LuCI 缓存与菜单
                echo 'echo "-> Refreshing LuCI menu and services..."' >> "$INSTALL_SH"
                echo 'rm -rf /tmp/luci-indexcache /tmp/luci-modulecache/*' >> "$INSTALL_SH"
                echo '/etc/init.d/luci-reload restart 2>/dev/null || true' >> "$INSTALL_SH"
                echo '/etc/init.d/rpcd restart 2>/dev/null || true' >> "$INSTALL_SH"
                
                echo 'echo "========================================="' >> "$INSTALL_SH"
                echo 'echo "Installation finished successfully!"' >> "$INSTALL_SH"
                echo 'echo "========================================="' >> "$INSTALL_SH"
                chmod +x "$INSTALL_SH"

                # 5. 打包 .run 文件
                tar -czf "${PLUGIN}.tar.gz" -C "$PKG_DIR" .
                
                RUN_HEAD="dist/${RUN_FILENAME}"
                echo '#!/bin/sh' > "$RUN_HEAD"                 echo 'TMPDIR="/tmp/runpkg_$$"' >> "$RUN_HEAD"
                echo 'mkdir -p "$TMPDIR"' >> "$RUN_HEAD"
                echo 'MATCH=$(grep -n "^__PAYLOAD_BELOW__$" "$0" \vert{} cut -d: -f1)' >> "$RUN_HEAD"
                echo 'if [ -z "$MATCH" ]; then' >> "$RUN_HEAD"
                echo '  echo "Error: Payload marker not found in .run file."' >> "$RUN_HEAD"
                echo '  rm -rf "$TMPDIR"' >> "$RUN_HEAD"
                echo '  exit 1' >> "$RUN_HEAD"
                echo 'fi' >> "$RUN_HEAD"
                echo 'PAYLOAD_LINE=$((MATCH + 1))' >> "$RUN_HEAD"
                echo 'tail -n +$PAYLOAD_LINE "$0" | tar -xz -C "$TMPDIR"' >> "$RUN_HEAD"
                echo 'cd "$TMPDIR"' >> "$RUN_HEAD"
                echo 'if [ -f "./install.sh" ]; then' >> "$RUN_HEAD"
                echo '  chmod +x ./install.sh' >> "$RUN_HEAD"
                echo '  ./install.sh' >> "$RUN_HEAD"
                echo '  RES=$?' >> "$RUN_HEAD"
                echo 'else' >> "$RUN_HEAD"
                echo '  echo "Error: install.sh not found inside package."' >> "$RUN_HEAD"
                echo '  RES=1' >> "$RUN_HEAD"
                echo 'fi' >> "$RUN_HEAD"
                echo 'cd /' >> "$RUN_HEAD"
                echo 'rm -rf "$TMPDIR"' >> "$RUN_HEAD"
                echo 'exit $RES' >> "$RUN_HEAD"
                echo '__PAYLOAD_BELOW__' >> "$RUN_HEAD"

                cat "${PLUGIN}.tar.gz" >> "$RUN_HEAD"
                chmod +x "$RUN_HEAD"
                rm -rf "$PKG_DIR" "${PLUGIN}.tar.gz"

              done
            done
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: "iStoreOS Plugins Release - ${{ env.BUILD_DATE }}"
          body: |
            ### 离线 `.run` 安装包（NanoPi 全系 ARM64 通用全量版）
            - ** NanoPi 全机型通用**：完美适配 NanoPi R2S / R3S / R4S / R5S / R5C / R6S / R76S 等全部 ARM64 路由设备。
            - **全插件全量依赖打包**：包含 `geoview`, `tcping`, `chinadns-ng` 等离线环境必须的二进制底包。
            - **分阶段安全部署**：先铺设底层二进制工具，再安装 LuCI 菜单与中文语言包。
          files: workspace/dist/*.run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Releases (Keep Recent 3 Days)
        uses: dev-drprasad/delete-older-releases@v0.3.0
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
